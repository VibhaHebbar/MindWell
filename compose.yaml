services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindwell}
      POSTGRES_USER: ${POSTGRES_USER:-mindwell_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindwell_app} -d ${POSTGRES_DB:-mindwell}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [mindwell_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mindwell}
      DB_USERNAME: ${POSTGRES_USER:-mindwell_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-32-byte-minimum}
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  mindwell_data:
